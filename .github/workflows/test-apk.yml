# Builds a debug APK of this test branch for installing by hand. Not part of any upstream proposal.
name: Test APK

on:
  push:
    branches: [claude/breadcrumb-test-build]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # One debug signing key across builds, so a new test APK installs as an update over the last
      # one. The runner would otherwise mint a fresh key per run, and Android refuses an update
      # signed by a different key. Kept in the Actions cache, never in the repository.
      - name: Restore debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: breadcrumb-test-debug-keystore-v1
      - name: Create debug signing key if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      # The map needs a Protomaps key; without the optional secret the app works but the map is blank.
      - name: Protomaps key
        env:
          KEY: ${{ secrets.PROTOMAPS_API_KEY }}
        run: echo "protomapsApiKey=$KEY" > local.properties
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: breadcrumb-test-debug
          path: app/build/outputs/apk/debug/*.apk
